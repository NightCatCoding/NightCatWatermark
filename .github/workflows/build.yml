name: Build and Release (All Platforms)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform_name: Windows
            sep: ';'
            artifact_ext: .exe
          
          - os: macos-latest
            platform_name: macOS
            sep: ':'
            artifact_ext: ''

          - os: ubuntu-latest
            platform_name: Linux
            sep: ':'
            artifact_ext: ''

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install Dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

        # CPU-only PyTorch (~200MB vs ~2GB for CUDA version)
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

        # Core dependencies
        pip install PyQt6 Pillow numpy trustmark

    - name: Pre-download TrustMark Models
      shell: bash
      run: |
        # TrustMark downloads model files on first init.
        # We must trigger this BEFORE PyInstaller freezes the package.
        python -c "
        from trustmark import TrustMark
        print('Downloading TrustMark Q models...')
        tm = TrustMark(verbose=True, model_type='Q', loadRemover=False, loadBBoxDetector=False)
        print('Models ready.')
        "

    - name: Locate TrustMark Models
      id: models
      shell: bash
      run: |
        # Find where trustmark stores its models
        TRUSTMARK_DIR=$(python -c "import trustmark, os; print(os.path.dirname(trustmark.__file__))")
        echo "trustmark_dir=$TRUSTMARK_DIR" >> $GITHUB_OUTPUT
        echo "TrustMark package: $TRUSTMARK_DIR"
        ls -la "$TRUSTMARK_DIR/models/" || echo "No models dir"

    - name: Build with PyInstaller
      shell: bash
      run: |
        ICON_PATH="app/ui/assets/watermark_icon.ico"
        TRUSTMARK_DIR="${{ steps.models.outputs.trustmark_dir }}"

        pyinstaller main.py \
          --name="NightCat_Watermark_${{ matrix.platform_name }}" \
          --windowed \
          --onefile \
          --clean \
          --icon="$ICON_PATH" \
          --additional-hooks-dir="." \
          --add-data "app/ui/styles.qss${{ matrix.sep }}app/ui" \
          --add-data "app/ui/assets${{ matrix.sep }}app/ui/assets" \
          --add-data "${TRUSTMARK_DIR}/models${{ matrix.sep }}trustmark/models" \
          --collect-data trustmark \
          --collect-submodules torch \
          --collect-submodules torchvision \
          --hidden-import trustmark \
          --hidden-import trustmark.trustmark \
          --hidden-import trustmark.datalayer \
          --hidden-import trustmark.bchecc \
          --hidden-import trustmark.model \
          --hidden-import trustmark.unet \
          --hidden-import trustmark.denoise \
          --exclude-module matplotlib \
          --exclude-module tkinter \
          --exclude-module unittest \
          --exclude-module email \
          --exclude-module http \
          --exclude-module xml \
          --exclude-module pandas \
          --exclude-module torch.cuda \
          --exclude-module torch.distributed

    - name: Compress Binary
      shell: bash
      run: |
        cd dist
        if [ "${{ matrix.os }}" == "windows-latest" ]; then
          powershell Compress-Archive -Path "NightCat_Watermark_${{ matrix.platform_name }}.exe" -DestinationPath "../NightCatWatermark_${{ matrix.platform_name }}.zip"
        else
          zip -r "../NightCatWatermark_${{ matrix.platform_name }}.zip" "NightCat_Watermark_${{ matrix.platform_name }}${{ matrix.artifact_ext }}"
        fi

    - name: Upload Artifact
      if: startsWith(github.ref, 'refs/tags/') != true
      uses: actions/upload-artifact@v4
      with:
        name: NightCatWatermark_${{ matrix.platform_name }}
        path: NightCatWatermark_${{ matrix.platform_name }}.zip

    - name: Release to GitHub
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: NightCatWatermark_${{ matrix.platform_name }}.zip
        prerelease: ${{ contains(github.ref, '-') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
